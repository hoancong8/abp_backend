version: '3.8'

services:

  # =========================
  # PostgreSQL Container (Lightweight DB for 1GB RAM VPS)
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: abp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: AbpSolution1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M

  # =========================
  # Backend (.NET 10 API Host)
  # =========================
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: abp-api
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=AbpSolution1;Username=postgres;Password=YourPassword123!
      - App__SelfUrl=http://163.227.231.23:8080
      - App__AngularUrl=http://163.227.231.23:4200
      - App__CorsOrigins=http://163.227.231.23:4200,http://localhost:4200,http://163.227.231.23:8080
      - AuthServer__Authority=http://163.227.231.23:8080
      - AuthServer__RequireHttpsMetadata=false
      - DOTNET_gcServer=0
      - DOTNET_GCHeapHardLimitPercent=40
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350M

  # =========================
  # Frontend (Angular + Nginx Alpine)
  # =========================
  frontend:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: abp-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 50M

# =========================
# Docker Volumes
# =========================
volumes:
  postgres_data: